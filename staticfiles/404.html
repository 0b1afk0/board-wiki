<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена - BoardWiki</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="container" style="background: white; border-radius: 16px; padding: 30px;">
        <div class="error-page">
            <h1 class="error-title">😵 В такие игры я еще не играл!</h1>
            
            <div class="error-image">
                <!-- Здесь будет ваша картинка -->
                <img src="/static/images/404.jpg" alt="Страница не найдена">
            </div>
            
            <p class="error-text">
                К сожалению, такой страницы не существует. Возможно она была перемещена или удалена.
            </p>
            
            <div class="error-actions">
                <button class="btn" onclick="history.back()">← Вернуться назад</button>
            </div>
        </div>
    </div>
</body>
</html>
